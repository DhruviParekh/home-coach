<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>15-Day Home Fitness Coach</title>
<meta name="theme-color" content="#136F63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Coach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF1EC; --surface: #FFFFFF; --surface-2: #F5F8F4; --ink: #15201B; --muted: #56665E; --line: #D5DDD6;
  --pine: #136F63; --pine-deep: #0C5249; --on-pine: #FFFFFF; --pine-soft: #D9ECE7;
  --marigold: #F4A300; --marigold-soft: #FCEBC4; --on-marigold: #2A1D00;
  --iris: #5F56CF; --iris-soft: #E4E2FA;
  --danger: #B3261E; --danger-soft: #FBE3E1;
  --stage: #E1EAE3; --stage-2: #D3DFD7;
  --fig-skin: #E0A47D; --fig-skin-far: #C4875F; --fig-top: #136F63; --fig-top-far: #0E574E;
  --fig-leg: #2A2C40; --fig-leg-far: #1B1C2B; --fig-shoe: #F4A300; --fig-hair: #3A2317; --fig-tie: #F4A300; --fig-eye: #2A2C40;
  --fig-band: #E0457B; --fig-db: #4A4F57; --fig-prop: #F6F8F5; --fig-prop-line: #8E9A93; --fig-floor: #C9D5CD; --fig-mat: #7FAEE0;
  --ghost-start: #136F63; --ghost-finish: #5F56CF;
  --strength: #136F63; --cardio: #E08E00; --recovery: #5F56CF;
  --radius-lg: 22px; --radius: 14px; --radius-sm: 9px;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1412; --surface: #16201C; --surface-2: #1B2723; --ink: #E7EEEA; --muted: #9DB0A7; --line: #2A3934;
    --pine: #3DB5A2; --pine-deep: #2C9888; --on-pine: #04211C; --pine-soft: #173A34;
    --marigold: #FFB627; --marigold-soft: #3A2E12; --on-marigold: #241900;
    --iris: #9F98F5; --iris-soft: #26244A;
    --danger: #FF8A80; --danger-soft: #3A1D1B;
    --stage: #18241F; --stage-2: #1F2D28;
    --fig-top: #2FA592; --fig-top-far: #22806F; --fig-leg: #3B3E5A; --fig-leg-far: #2B2D44; --fig-hair: #2A180F; --fig-eye: #1B1C2B;
    --fig-prop: #24322D; --fig-prop-line: #6E7F77; --fig-floor: #2A3934; --fig-mat: #3E6E9E; --fig-db: #9AA3AC;
    --ghost-start: #3DB5A2; --ghost-finish: #9F98F5;
    --strength: #3DB5A2; --cardio: #FFB627; --recovery: #9F98F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1412; --surface: #16201C; --surface-2: #1B2723; --ink: #E7EEEA; --muted: #9DB0A7; --line: #2A3934;
  --pine: #3DB5A2; --pine-deep: #2C9888; --on-pine: #04211C; --pine-soft: #173A34;
  --marigold: #FFB627; --marigold-soft: #3A2E12; --on-marigold: #241900;
  --iris: #9F98F5; --iris-soft: #26244A;
  --danger: #FF8A80; --danger-soft: #3A1D1B;
  --stage: #18241F; --stage-2: #1F2D28;
  --fig-top: #2FA592; --fig-top-far: #22806F; --fig-leg: #3B3E5A; --fig-leg-far: #2B2D44; --fig-hair: #2A180F; --fig-eye: #1B1C2B;
  --fig-prop: #24322D; --fig-prop-line: #6E7F77; --fig-floor: #2A3934; --fig-mat: #3E6E9E; --fig-db: #9AA3AC;
  --ghost-start: #3DB5A2; --ghost-finish: #9F98F5;
  --strength: #3DB5A2; --cardio: #FFB627; --recovery: #9F98F5;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.app { max-width: 560px; margin: 0 auto; padding: 18px 18px 104px; }
.loading { padding: 40px; text-align: center; color: var(--muted); }

/* ---------- Top ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 28px; height: 28px; border-radius: 9px; background: var(--pine); display: grid; place-items: center; color: var(--on-pine); font-size: 15px; font-weight: 800; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="true"] { background: var(--pine); color: var(--on-pine); border-color: var(--pine); }

/* ---------- Hero / today ---------- */
.hero { background: var(--pine); color: var(--on-pine); border-radius: var(--radius-lg); padding: 20px 20px 18px; position: relative; overflow: hidden; }
.hero-day { font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: .85; letter-spacing: -0.04em; }
.hero-day small { font-size: 22px; font-weight: 600; letter-spacing: 0; opacity: .8; margin-left: 4px; }
.hero-title { font-family: var(--font-display); font-size: 23px; font-weight: 600; margin-top: 10px; max-width: 22ch; }
.hero-meta { margin-top: 6px; font-size: 14px; opacity: .85; }
.hero-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero-peek { width: 132px; height: 104px; border-radius: 16px; overflow: hidden; background: var(--stage); flex: none; }
.hero-peek svg { width: 100%; height: 100%; display: block; }
.hero .btn { padding: 12px 18px; }
.hero-actions { display: flex; gap: 10px; margin-top: 16px; position: relative; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn { white-space: nowrap; }
.btn-primary { background: var(--marigold); color: var(--on-marigold); }
.btn-pine { background: var(--pine); color: var(--on-pine); }
.btn-ghost { background: transparent; border: 1.5px solid currentColor; }
.btn-soft { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.hero .btn-ghost { color: var(--on-pine); }

.section { margin-top: 26px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.section-head h2 { font-size: 21px; font-weight: 700; }
.section-head span { font-size: 14px; color: var(--muted); }

/* ---------- Calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cal-tile { aspect-ratio: 1 / 1.08; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); padding: 8px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; position: relative; overflow: hidden; }
.cal-tile .n { font-family: var(--font-display); font-size: 25px; font-weight: 700; line-height: 1; }
.cal-tile .k { font-size: 11.5px; color: var(--muted); line-height: 1.15; }
.cal-tile::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--type, var(--strength)); }
.cal-tile.cur { border: 2px solid var(--marigold); }
.cal-tile.done { background: var(--pine-soft); }
.cal-tile .chk { position: absolute; top: 7px; right: 7px; width: 20px; height: 20px; border-radius: 50%; background: var(--pine); color: var(--on-pine); display: grid; place-items: center; }
.cal-tile .chk svg { width: 12px; height: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; }
.note { display: flex; gap: 12px; align-items: flex-start; }
.note svg { flex: none; width: 22px; height: 22px; color: var(--danger); margin-top: 2px; }
.note h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.note p { font-size: 14.5px; color: var(--muted); }
.linkish { background: none; border: 0; padding: 0; color: var(--pine); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Tab bar ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { background: none; border: 0; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--pine); }

/* ---------- Day view ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; font-weight: 600; color: var(--muted); }
.back svg { width: 18px; height: 18px; }
.day-head { margin: 10px 0 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--type, var(--strength)); }
.day-head h1 { font-size: 32px; font-weight: 800; margin-top: 10px; }
.day-head p { color: var(--muted); margin-top: 6px; }
.block { margin-top: 20px; }
.block-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 8px; border-bottom: 1px solid var(--line); }
.block-h h3 { font-size: 17px; font-weight: 700; }
.block-h span { font-size: 13.5px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.thumb { width: 64px; height: 50px; border-radius: 10px; background: var(--stage); flex: none; overflow: hidden; }
.thumb svg { width: 100%; height: 100%; display: block; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 650; font-size: 15.5px; }
.row .t span { font-size: 13.5px; color: var(--muted); }
.row .chev { color: var(--muted); width: 18px; height: 18px; flex: none; }
.sticky-cta { position: fixed; left: 0; right: 0; bottom: 64px; z-index: 15; padding: 12px 18px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.sticky-cta .in { max-width: 524px; margin: 0 auto; display: flex; gap: 10px; }
.check-row { display: flex; align-items: center; gap: 10px; margin-top: 22px; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.check-row input { width: 22px; height: 22px; accent-color: var(--pine); }
.check-row label { flex: 1; font-weight: 600; }
.check-row small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }

/* ---------- Exercise detail ---------- */
.stage { position: relative; background: radial-gradient(120% 90% at 50% 15%, var(--stage) 0%, var(--stage-2) 100%); border-radius: var(--radius-lg); overflow: hidden; }
.stage svg.fig { display: block; width: 100%; height: auto; }
.phase { position: absolute; top: 12px; left: 12px; font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--surface); color: var(--ink); opacity: 0; transition: opacity .15s; }
.phase.on { opacity: 1; }
.phase.start { color: var(--ghost-start); }
.phase.finish { color: var(--ghost-finish); }
.stage-key { position: absolute; bottom: 10px; right: 12px; display: flex; gap: 10px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--surface) 82%, transparent); padding: 4px 9px; border-radius: 999px; }
.stage-key i { display: inline-block; width: 14px; border-top: 2px dashed; vertical-align: 3px; margin-right: 4px; }
.stage-view { position: absolute; top: 12px; right: 12px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 82%, transparent); padding: 3px 9px; border-radius: 999px; }
.how { margin-top: 18px; }
.how h1 { font-size: 28px; font-weight: 800; }
.how .muscles { color: var(--muted); margin-top: 4px; }
.how dl { margin: 18px 0 0; }
.how dt { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-top: 16px; }
.how dd { margin: 4px 0 0; color: var(--ink); }
.how ol, .how ul { margin: 6px 0 0; padding-left: 22px; }
.how li { margin: 3px 0; }
.how .muted { color: var(--muted); }
.lib-group { margin-top: 22px; }
.lib-group h2 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }

/* ---------- Player ---------- */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.player-in { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px); }
.p-top { display: flex; align-items: center; gap: 10px; }
.p-top .ttl { flex: 1; min-width: 0; }
.p-top .ttl b { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-top .ttl span { font-size: 13px; color: var(--muted); }
.p-clock { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.pbar { margin: 12px 0 14px; }
.pbar-track { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.pbar-fill { height: 100%; background: var(--pine); border-radius: 99px; transition: width .4s; }
.pbar-label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.p-stage-wrap { position: relative; }
.p-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.p-name { min-width: 0; }
.p-big { font-family: var(--font-display); font-weight: 800; font-size: 58px; line-height: .9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; flex: none; }
.p-big small { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--muted); margin-bottom: 4px; font-family: var(--font-body); }
.p-info { margin-top: 14px; }
.p-info .block-name { font-size: 13.5px; font-weight: 700; color: var(--pine); }
.p-info h2 { font-size: 27px; font-weight: 800; margin-top: 2px; }
.p-info .sub { font-size: 16px; color: var(--muted); margin-top: 3px; }
.cue { margin-top: 12px; background: var(--marigold-soft); border-radius: var(--radius); padding: 12px 14px; font-weight: 700; font-size: 17px; display: flex; gap: 10px; align-items: center; min-height: 52px; }
.cue svg { width: 20px; height: 20px; flex: none; color: var(--marigold); }
.cue.side { background: var(--iris-soft); }
.controls { display: grid; grid-template-columns: 56px 1fr 56px; gap: 10px; align-items: center; margin-top: 16px; }
.ctrl { height: 56px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.ctrl svg { width: 24px; height: 24px; }
.ctrl:disabled { opacity: .35; }
.main-act { height: 56px; border-radius: 18px; border: 0; background: var(--pine); color: var(--on-pine); font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.main-act.go { background: var(--marigold); color: var(--on-marigold); }
.main-act svg { width: 22px; height: 22px; }
.sub-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.sub-acts .btn { min-height: 40px; padding: 8px 14px; font-size: 14px; }
.rest-panel { text-align: center; padding: 22px 16px 18px; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--line); }
.ring { position: relative; width: 180px; height: 180px; margin: 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 52px; font-variant-numeric: tabular-nums; }
.ring .num small { display: block; font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; margin-top: -6px; }
.next-up { display: flex; align-items: center; gap: 12px; text-align: left; margin-top: 16px; padding: 10px; border-radius: var(--radius); background: var(--surface-2); }
.next-up .thumb { width: 84px; height: 64px; }
.next-up b { display: block; }
.next-up span { font-size: 14px; color: var(--muted); }
.alt { margin-top: 10px; font-size: 14.5px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--iris-soft); }
.test-box { margin-top: 14px; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--marigold); }
.test-box label { font-weight: 700; display: block; margin-bottom: 8px; }
.test-box .in { display: flex; gap: 8px; }
.field { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 17px; min-height: 46px; }
.details { margin-top: 18px; border-top: 1px solid var(--line); }
.details summary { list-style: none; padding: 14px 2px; font-weight: 700; display: flex; justify-content: space-between; cursor: pointer; }
.details summary::-webkit-details-marker { display: none; }
.details summary svg { width: 18px; height: 18px; transition: transform .2s; }
.details[open] summary svg { transform: rotate(180deg); }
.done-wrap { text-align: center; padding-top: 30px; }
.done-wrap h1 { font-size: 38px; font-weight: 800; margin-top: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 8px; text-align: center; }
.stat b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 800; }
.stat span { font-size: 12.5px; color: var(--muted); }

/* ---------- Progress ---------- */
.prog-top { display: flex; align-items: center; gap: 18px; }
.big-ring { width: 132px; height: 132px; position: relative; flex: none; }
.big-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.big-ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; }
.big-ring .num small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); font-family: var(--font-body); margin-top: 4px; }
.mini-stats { flex: 1; display: grid; gap: 8px; }
.mini-stats div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-size: 15px; }
.mini-stats b { font-family: var(--font-display); font-size: 19px; }
.mtable { width: 100%; border-collapse: collapse; }
.mtable th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 6px 4px; }
.mtable td { padding: 6px 4px; vertical-align: middle; border-top: 1px solid var(--line); }
.mtable td:first-child { font-weight: 650; font-size: 14.5px; }
.mtable td:first-child small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.mtable input { width: 100%; min-width: 0; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; text-align: center; }
.delta { font-weight: 700; font-size: 14.5px; text-align: center; white-space: nowrap; }
.hint { font-size: 13.5px; color: var(--muted); margin-top: 10px; }
.tips p + p { margin-top: 8px; }
.tips p { font-size: 15px; }
.sync { font-size: 12.5px; color: var(--muted); margin-top: 18px; text-align: center; }

/* ---------- Modal ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 80; background: rgba(8, 14, 12, .55); display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--surface); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 20px); max-height: 88vh; overflow-y: auto; }
@media (min-width: 640px) { .modal-bg { align-items: center; } .modal { border-radius: 24px; } }
.modal h2 { font-size: 24px; font-weight: 800; }
.modal ul { padding-left: 20px; margin: 10px 0; }
.modal li { margin: 5px 0; }
.modal p { margin-top: 10px; color: var(--muted); }
.stop-list { background: var(--danger-soft); border-radius: var(--radius); padding: 12px 14px; margin-top: 14px; }
.stop-list b { color: var(--danger); }

/* ---------- v1.1 player ---------- */
.phase.guide { color: var(--pine); opacity: 1; font-size: 15px; padding: 5px 12px; }
.cd-num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 120px; color: var(--marigold); text-shadow: 0 2px 18px var(--stage); pointer-events: none; }
.breath { position: absolute; left: 12px; bottom: 12px; font-weight: 800; font-size: 15px; padding: 5px 12px; border-radius: 999px; background: var(--surface); }
.breath.inhale { color: var(--pine); } .breath.exhale { color: var(--iris); } .breath.hold { color: var(--muted); }
.side-pill { position: absolute; right: 12px; bottom: 12px; font-weight: 800; font-size: 14px; padding: 5px 12px; border-radius: 999px; background: var(--iris); color: var(--surface); }
.demo-media { display: block; width: 100%; aspect-ratio: 260 / 192; object-fit: contain; background: var(--stage); }
.prep-card { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px; }
.prep-row + .prep-row { margin-top: 10px; }
.prep-row b { font-family: var(--font-display); font-size: 15px; }
.prep-row p, .prep-row ul { margin: 2px 0 0; font-size: 15px; }
.prep-row ul { padding-left: 20px; }
.prep-row.warn b { color: var(--danger); }
.big-go { width: 100%; margin-top: 12px; min-height: 60px; font-size: 19px; }
.center { text-align: center; }
.rep-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.rep-grid.three { grid-template-columns: repeat(3, 1fr); }
.rep-grid div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 4px; text-align: center; }
.rep-grid span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.rep-grid b { font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }
.side-line { margin-top: 8px; font-weight: 700; color: var(--iris); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 9px 14px; font-weight: 700; font-size: 14px; min-height: 42px; }
.seg button[aria-pressed="true"] { background: var(--pine); color: var(--on-pine); }
.seg.wide { display: flex; margin-top: 12px; }
.seg.wide button { flex: 1; }
.paced-note { font-size: 13.5px; color: var(--muted); margin-top: 8px; }
.rep-btns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 12px; }
.rep-btns button { min-height: 72px; border-radius: 18px; font-weight: 800; font-size: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.rep-btns .rep-plus { background: var(--pine-soft); border-color: var(--pine); color: var(--pine-deep); font-size: 24px; }
.rep-btns button:nth-child(3) { grid-column: 1 / -1; min-height: 52px; font-size: 16px; }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; }
.stepper button { min-height: 60px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); font-size: 28px; font-weight: 800; }
.stepper input { text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 32px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.paused-card { margin-top: 12px; display: grid; gap: 8px; padding: 14px; border-radius: var(--radius-lg); background: var(--iris-soft); text-align: center; }
.paused-card b { font-family: var(--font-display); font-size: 22px; }
.start-card { margin-top: 14px; text-align: center; }
.start-card h2 { font-size: 24px; font-weight: 800; }
.prep-tip { display: block; font-size: 13px; color: var(--pine); margin-top: 2px; }
.btn.stop { color: var(--danger); }
.opt-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
.opt-row.col { flex-direction: column; align-items: stretch; }
.opt-row > span, .opt-row > label { font-weight: 700; }
.disclaimer { margin-top: 20px; font-size: 12.5px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* v1.1: keep rep controls within one phone screen */
@media (max-height: 900px) { .p-info h2 { font-size: 24px; } .p-big { font-size: 50px; } }

/* v1.2 */
.voice-check { margin: 10px 0; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--marigold-soft); font-size: 14.5px; color: var(--ink); }
.voice-check.ok { background: var(--pine-soft); }

/* ---------- v2.0 ---------- */
.tabs-in.four { grid-template-columns: repeat(4, 1fr); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 650; font-size: 14px; min-height: 40px; white-space: nowrap; }
.chip-btn[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--on-pine); }
.form-sec { margin-top: 14px; }
.form-sec h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.lvl { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-right: 4px; vertical-align: 1px; }
.lvl1 { background: var(--pine-soft); color: var(--pine); }
.lvl2 { background: var(--marigold-soft); color: var(--ink); }
.lvl3 { background: var(--iris-soft); color: var(--iris); }
.tagline { margin-top: 6px; font-size: 14px; color: var(--muted); }
.plan-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
.plan-bar small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
.plan-bar b { font-size: 15px; }
.plan-bar-act { display: flex; align-items: center; gap: 2px; color: var(--pine); font-weight: 700; font-size: 14px; flex: none; }
.plan-bar-act svg { width: 16px; height: 16px; }
.plan-row { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 6px 6px 6px 0; margin-top: 10px; }
.plan-row.active { border: 2px solid var(--pine); }
.plan-row-main { flex: 1; text-align: left; background: none; border: 0; padding: 8px 14px; }
.plan-row-main b { display: block; }
.plan-row-main span { font-size: 13.5px; color: var(--muted); }
.week-prev { margin: 8px 0 0; padding-left: 22px; }
.week-prev li { margin: 4px 0; }
.week-prev span { color: var(--muted); font-size: 13.5px; }
.wk-list { display: grid; gap: 10px; margin-top: 18px; }
.wk-card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-lg); padding: 14px; display: grid; gap: 4px; }
.wk-card b { font-family: var(--font-display); font-size: 18px; }
.wk-card > span { font-size: 14px; color: var(--muted); }
.wk-card.custom { background: var(--pine); border-color: var(--pine); color: var(--on-pine); }
.wk-card.custom > span { color: var(--on-pine); opacity: .85; }
.wk-top { display: flex; justify-content: space-between; align-items: center; }
.wk-min { font-weight: 700; font-size: 13.5px; color: var(--muted); }
.hist { list-style: none; padding: 0; margin: 12px 0 0; }
.hist li { padding: 8px 0; border-top: 1px solid var(--line); }
.hist b { display: block; font-size: 14.5px; }
.hist span { font-size: 13px; color: var(--muted); }

/* ---------- v2.1 ---------- */
.form-sec h3 small { font-weight: 500; color: var(--muted); font-size: 13px; }
.form-err { color: var(--danger); font-weight: 600; font-size: 14.5px; margin-top: 12px; }
.result-card h2 { font-size: 24px; margin: 6px 0; }
.level-notice { background: var(--pine-soft); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; display: grid; gap: 4px; }
.level-notice span { font-size: 14px; }
.cal-tile.rest { background: var(--surface-2); border-style: dashed; }
.yt-link { display: inline-block; margin-top: 16px; font-weight: 700; color: var(--pine); }

</style>

    var goPlan = function () { setView({ tab: 'plan', day: null, ex: null }); };
    if (view.ex) content = html`<${ExerciseView} id=${view.ex} onBack=${function () { setView(Object.assign({}, view, { ex: null })); }} />`;
    else if (view.tab === 'plan' && view.pick) content = html`<${PlanPicker} state=${state} onBack=${goPlan}
        onSelect=${function (id) { set({ activePlan: id }); goPlan(); }} onNew=${function () { setView({ tab: 'plan', create: true }); }}
        onDelete=${function (id) { set(function (s) { var p = Object.assign({}, s.plans); delete p[id]; return { plans: p, activePlan: s.activePlan === id ? 'core15' : s.activePlan }; }); }} />`;
    else if (view.tab === 'plan' && view.create && needQuiz) content = quizView({ tab: 'plan', create: true });
    else if (view.tab === 'plan' && view.create) content = html`<${PlanBuilder} profile=${state.profile} onBack=${function () { setView({ tab: 'plan', pick: true }); }}
        onCreate=${function (params) { set(function (s) { var p = Object.assign({}, s.plans); p[params.id] = { params: params, created: Date.now(), done: {}, session: null }; return { plans: p, activePlan: params.id }; }); goPlan(); }} />`;
    else if (view.tab === 'plan' && view.planDay && activePlan && P2.planDays(activePlan.params)[view.planDay - 1].rest) content = html`<${RestDayView} day=${P2.planDays(activePlan.params)[view.planDay - 1]} onBack=${goPlan}
        onStretch=${function () { startQuick(P2.buildWorkout({ type: 'mobility', level: 1, minutes: 10, goal: 'flexibility', seed: 'restday', title: 'Rest-day mobility' })); }} />`;
    else if (view.tab === 'plan' && view.planDay && activePlan) {
      var pd = P2.planDays(activePlan.params)[view.planDay - 1], pdone = (activePlan.done || {})[view.planDay];
      content = html`<${WorkoutDetail} day=${pd} label=${'Day ' + view.planDay} backLabel="All days" done=${pdone}
        resuming=${activePlan.session && activePlan.session.day === view.planDay} onBack=${goPlan} onExercise=${openEx}
        onStart=${function () { startPlanDay(view.planDay); }}
        onMark=${function (v) { var n = view.planDay; updPlan(activePlan.params.id, function (p) { if (v) p.done[n] = { date: new Date().toISOString(), min: Math.round(estMinutes(pd)), manual: true }; else delete p.done[n]; }); }} />`;
    }
    else if (view.tab === 'plan' && view.day) content = html`<${DayView} n=${view.day} state=${state} onBack=${goPlan}
        onStart=${start} onExercise=${openEx} onMark=${markDay} onProgress=${function () { setView({ tab: 'progress', day: null, ex: null }); }} />`;
    else if (view.tab === 'plan') content = html`<div>
        <${LevelNotice} profile=${state.profile} onOk=${noticeOk} onUndo=${noticeUndo} />
        <${PlanBar} state=${state} onPick=${function () { setView({ tab: 'plan', pick: true }); }} />
        ${activePlan ? html`<${PlanHome} plan=${activePlan} onStart=${startPlanDay} onOpenDay=${function (n) { setView({ tab: 'plan', planDay: n }); }} />`
          : html`<${Home} state=${state} onStart=${start} onOpenDay=${openDay} onSafety=${function () { setSafety(true); }} />`}
      </div>`;
    else if (view.tab === 'workouts' && view.workout) content = html`<${WorkoutDetail} day=${view.workout} onBack=${function () { setView({ tab: 'workouts' }); }} onExercise=${openEx}
        resuming=${state.quick && state.quick.wid === (view.workout.catalogId || 'custom') + '|' + view.workout.title} onStart=${function () { startQuick(view.workout); }} />`;
    else if (view.tab === 'workouts' && needQuiz) content = quizView({ tab: 'workouts' });
    else if (view.tab === 'workouts') content = html`<${Workouts} profile=${state.profile} onNoticeOk=${noticeOk} onNoticeUndo=${noticeUndo} onOpen=${function (w) { setView({ tab: 'workouts', workout: w }); }} />`;
    else if (view.tab === 'library') content = html`<${Library} onExercise=${openEx} />`;
    else if (view.tab === 'progress' && view.quiz) content = quizView({ tab: 'progress' });
    else content = html`<${Progress} state=${state} set=${set} onProfile=${setProfile} onQuiz=${function () { setView({ tab: 'progress', quiz: true }); }} onImport=${function (data) { saveLocal(data); setState(data); }} onReset=${function () { var f = freshState(); f.safetyOk = true; set(f); }} />`;

    function tab(id, label, icon) {
      var cur = view.tab === id && !view.ex && !view.day && !view.planDay && !view.pick && !view.create && !view.workout && !view.quiz;
      return html`<button className="tab" aria-current=${cur ? 'page' : undefined} onClick=${function () { setView({ tab: id, day: null, ex: null }); }}>${icon}<span>${label}</span></button>`;
    }

    // resume data and save handlers for the current player context
    var pl = playing, resumeData = null, saveSess = null, complete = null;
    if (pl && pl.ctx === 'core') {
      resumeData = state.session && state.session.day === pl.n ? state.session : null;
      saveSess = function (ss) { set({ session: ss }); };
      complete = function (n, min, toProgress, summary) { markDay(n, true, min, summary); set({ session: null }); addHistory({ date: new Date().toISOString(), title: '15-day plan, Day ' + n + ': ' + DAYS[n - 1].title, min: min, reps: summary && summary.reps, rating: summary && summary.rating }); setPlaying(null); setView(toProgress ? { tab: 'progress', day: null, ex: null } : { tab: 'plan', day: null, ex: null }); };
    } else if (pl && pl.ctx === 'plan') {
      var pp = state.plans[pl.planId];
      resumeData = pp && pp.session && pp.session.day === pl.n ? pp.session : null;
      saveSess = function (ss) { updPlan(pl.planId, function (p) { p.session = ss; }); };
      complete = function (n, min, toProgress, summary) {
        updPlan(pl.planId, function (p) { p.done[n] = { date: new Date().toISOString(), min: min, reps: summary && summary.reps, skipped: summary && summary.skipped }; p.session = null; });
        recordAdaptive(P2.planName(pp.params) + ', Day ' + n, min, summary, pp.params.level); setPlaying(null); goPlan();
      };
    } else if (pl && pl.ctx === 'quick') {
      resumeData = state.quick && state.quick.wid === pl.wid ? state.quick.session : null;
      saveSess = function (ss) { set({ quick: { wid: pl.wid, session: ss } }); };
      complete = function (n, min, toProgress, summary) { set({ quick: null }); recordAdaptive(pl.day.title, min, summary, (pl.day.meta && pl.day.meta.level) || 1); setPlaying(null); setView({ tab: 'progress' }); };
    }

    return html`<div>
      <div className="app">
        <header className="top">
          <div className="brand"><span className="brand-mark">15</span>Home Coach</div>
          <button className="icon-btn" aria-label="Safety guide" onClick=${function () { setSafety(true); }}>${ic.alert()}</button>
        </header>
        <main>${content}</main>
      </div>
      <nav className="tabs" aria-label="Main"><div className="tabs-in four">
        ${tab('plan', 'Plan', ic.cal())}${tab('workouts', 'Workouts', ic.bolt2())}${tab('library', 'Exercises', ic.list())}${tab('progress', 'Progress', ic.chart())}
      </div></nav>
      ${pl && html`<${Player} n=${pl.n} key=${pl.ctx + '|' + (pl.planId || '') + '|' + pl.n + '|' + (pl.wid || '')} ctx=${pl.ctx} day=${pl.day} label=${pl.label} state=${state}
          resume=${resumeData}
          saveSession=${saveSess}
          setVoice=${function (v) { set({ voice: v }); }}
          setSettings=${function (p) { set(function (s) { return { settings: Object.assign({}, s.settings || {}, p) }; }); }}
          setGhosts=${function (v) { set({ ghosts: v }); }}
          saveTest=${function (n, k, v) { if (pl.ctx !== 'core') return; set(function (s) { var t = JSON.parse(JSON.stringify(s.tests)); t[n === 1 ? 'start' : 'end'][k] = v; return { tests: t }; }); }}
          onSafety=${function () { setSafety(true); }}
          onClose=${function () { setPlaying(null); coach.cancelAll(); }}
          onComplete=${complete} />`}
      ${safety && html`<${SafetyModal} first=${!state.safetyOk} onClose=${function () { setSafety(false); if (!state.safetyOk) set({ safetyOk: true }); }} />`}
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();

</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
